services:
  postgres:
    image: postgres:16
    container_name: mcpshield-postgres
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-mcpshield}
      POSTGRES_USER: ${POSTGRES_USER:-mcpshield}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-mcpshield}
    volumes:
      - mcpshield-postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-mcpshield} -d ${POSTGRES_DB:-mcpshield}"]
      interval: 5s
      timeout: 5s
      retries: 10
      start_period: 10s

volumes:
  mcpshield-postgres-data:
